<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shengji</title>
  <link rel="icon" href="favicon.ico">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      color: #1f2937;
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    nav {
      display: grid;
      gap: 12px;
      width: min(320px, 100%);
    }
    .home-btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      text-align: center;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      font-size: 16px;
      line-height: 1.3;
    }
    .home-btn[disabled] {
      color: #9ca3af;
      background: #f3f4f6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main>
    <nav aria-label="home controls">
      <a href="static/html/game.html" data-home-button="game" data-i18n="buttons.homePlayCards" class="home-btn">打牌</a>
      <a href="static/html/review.html" data-home-button="review" data-i18n="buttons.homeReview" class="home-btn">复盘</a>
      <button type="button" data-home-button="archive" data-i18n="buttons.homeArchive" class="home-btn" disabled>文库</button>
    </nav>
  </main>

  <script src="static/js/i18n/zh-CN.js"></script>
  <script src="static/js/i18n/en.js"></script>
  <script src="static/js/i18n/index.js"></script>
  <script>document.addEventListener('DOMContentLoaded', applyI18n);</script>
</body>
</html>
